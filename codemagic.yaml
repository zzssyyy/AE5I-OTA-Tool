workflows:
  ae5i-unsigned-ipa:
    name: AE5I OTA Tool (unsigned IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "AE5I_OTA_Tool.xcodeproj"
        SCHEME: "AE5IOTATool"
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || brew upgrade xcodegen
          xcodegen --version
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Build (unsigned)
        script: |
          xcodebuild -project "$XCODE_PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package unsigned IPA
        script: |
          set -e
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r AE5I_OTA_Tool.ipa Payload
          ls -la AE5I_OTA_Tool.ipa
    artifacts:
      - AE5I_OTA_Tool.ipa
      - build/Build/Products/Release-iphoneos/*.app
